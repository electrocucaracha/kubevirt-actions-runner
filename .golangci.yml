version: "2"
linters:
  default: all
  disable:
    # exhaustruct/exhaustruct_v5 flag any struct literal missing optional
    # fields, which is impractical noise for large third-party Kubernetes
    # API structs (e.g. VirtualMachineSpec) with dozens of optional fields.
    - exhaustruct
    - exhaustruct_v5
    # gomodguard and wsl are superseded by their v2/v5 successors enabled
    # below; keeping both active would duplicate findings.
    - gomodguard
    - wsl
  enable:
    - gomodguard_v2
    - wsl_v5
  settings:
    depguard:
      rules:
        prevent_unmaintained_packages:
          allow:
            - $gostd
            - github.com/electrocucaracha/kubevirt-actions-runner/cmd/kar/app
            - github.com/electrocucaracha/kubevirt-actions-runner/internal
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - k8s.io/api/core/v1
            - k8s.io/apimachinery/pkg/api/errors
            - k8s.io/apimachinery/pkg/apis/meta/v1
            - k8s.io/apimachinery/pkg/fields
            - k8s.io/apimachinery/pkg/runtime/schema
            - k8s.io/apimachinery/pkg/types
            - k8s.io/apimachinery/pkg/watch
            - kubevirt.io/api/core/v1
            - kubevirt.io/client-go/containerizeddataimporter/fake
            - kubevirt.io/client-go/kubecli
            - kubevirt.io/client-go/kubevirt/fake
            - kubevirt.io/containerized-data-importer-api/pkg/apis/core/v1beta1
            - github.com/cucumber/godog
            - go.uber.org/zap
            - go.uber.org/mock/gomock
            - go.opentelemetry.io/otel
            - go.opentelemetry.io/otel/attribute
            - go.opentelemetry.io/otel/trace
            - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp
            - go.opentelemetry.io/otel/exporters/stdout/stdouttrace
            - go.opentelemetry.io/otel/sdk/resource
            - go.opentelemetry.io/otel/sdk/trace
            - go.opentelemetry.io/otel/semconv/v1.24.0
    gomoddirectives:
      replace-allow-list:
        - k8s.io/kube-openapi
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # TestCancelAppContextResetsSingleton mutates a package-level
      # singleton and must run sequentially with its own cleanup, so it
      # cannot be marked parallel without introducing test flakiness.
      - linters:
          - paralleltest
        path: internal/appcontext_test\.go
        text: "TestCancelAppContextResetsSingleton"
      # getClientAndNamespace returns kubecli.KubevirtClient, an interface
      # from the upstream KubeVirt client library required for testability
      # (fakeable client injection); there is no concrete type to return.
      - linters:
          - ireturn
        path: cmd/kar/main\.go
        text: "getClientAndNamespace returns interface"
      # createExporter selects between multiple trace.SpanExporter
      # implementations (OTLP, stdout) at runtime, so returning the
      # interface type is required by design.
      - linters:
          - ireturn
        path: internal/telemetry\.go
        text: "createExporter returns interface"
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
