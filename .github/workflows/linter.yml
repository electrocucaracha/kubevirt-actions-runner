name: "CI: Lint and Static Checks"
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
permissions: read-all
jobs:
  get-sloc:
    name: Measure Repository SLOC
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.27"
          cache: false
      - name: Install dependencies
        run: go install github.com/boyter/scc/v3@v3.7.0
      - name: Run scc tool
        run: scc --format wide
  check-broken-links:
    name: Validate Documentation Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check broken links
        uses: tcort/github-action-markdown-link-check@e7c7a18363c842693fadde5d41a3bd3573a7a225 # v1.1.2
  check-super-linter:
    name: Check syntax (super-linter)
    permissions:
      contents: read
      models: read
      issues: write
    uses: electrocucaracha/gh-workflows/.github/workflows/linter.yml@7362342ec4b465d80999556fae6bb61b3e56f010 # v7.0.8
    with:
      validate_overrides: |-
        {
          "VALIDATE_GO_MODULES": false,
          "VALIDATE_GO": false,
          "VALIDATE_BIOME_FORMAT": false,
          "VALIDATE_PRE_COMMIT": false,
          "VALIDATE_SPELL_CODESPELL": false,
          "SAVE_SUPER_LINTER_OUTPUT": true,
          "KUBERNETES_KUBECONFORM_OPTIONS": "-ignore-missing-schemas"
        }
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
