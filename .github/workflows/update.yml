name: "Maintenance: Scheduled Dependency Version Updates"
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:
permissions: read-all
concurrency:
  group: scheduled-version-updates
  cancel-in-progress: true
jobs:
  check-versions:
    name: Update Managed Version Files
    permissions:
      contents: write
      pull-requests: write
    uses: electrocucaracha/gh-workflows/.github/workflows/update.yml@a3c043874dc247ce98753c63f0cded0e4a9cb8a2 # v9.4.4
    secrets:
      WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
