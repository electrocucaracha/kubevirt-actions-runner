name: "Maintenance: Scheduled Dependency Version Updates"
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:
permissions: read-all
concurrency:
  group: scheduled-version-updates
  cancel-in-progress: true
jobs:
  check-versions:
    name: Update Managed Version Files
    permissions:
      contents: write
      pull-requests: write
    uses: electrocucaracha/gh-workflows/.github/workflows/update.yml@916eea77ebd88369f988d06b18581a16c8b8b749 # v9.3.6
    secrets:
      WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
