name: "Maintenance: Code Base Quality Improvements"
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 0 15 * *"
  workflow_dispatch:
permissions: read-all
jobs:
  improvers:
    name: Run Quality Improvers
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: electrocucaracha/gh-workflows/.github/workflows/improvers.yml@5459142baf98c47e96f454bb56e3e549c334a606 # v13.1.1
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
